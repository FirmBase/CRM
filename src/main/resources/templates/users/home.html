<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Users</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

		<link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
		<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}" type="text/javascript" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

		<script th:src="@{/jQuery/js/jquery-4.0.0.min.js}" type="text/javascript" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

		<link th:href="@{/datatable/css/datatables.min.css}" rel="stylesheet" />
		<script th:src="@{/datatable/js/datatables.min.js}" type="text/javascript"></script>

		<link th:href="@{/css/table.css}" rel="stylesheet" />
		<script th:src="@{/js/toasts-notification.js}" type="text/javascript"></script>
		<script th:inline="javascript" type="text/javascript">
		</script>
	</head>
	<body>
		<th:block th:replace="~{fragments/navigation-bar :: navigation-bar}"></th:block>
		<div class="container-fluid">
			<div class="row">
				<div class="col-12">
					<table class="table table-striped table-bordered table-hover">
						<thead>
							<tr>
								<th scope="col">S.No.</th>
								<th scope="col">Name</th>
								<th scope="col">E-Mail</th>
								<th scope="col">Role</th>
								<th scope="col">Onboard</th>
								<th scope="col">Action</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="user, status: ${users}" th:if="${users.size > 0}">
								<td scope="row" th:text="${status.count}"></td>
								<td th:text="${user.firstName + ' ' + user.middleName + ' ' + user.lastName}"></td>
								<td th:text="${user.email}"></td>
								<td>
									<form th:action="@{role}" enctype="application/x-www-form-urlencoded" method="post">
										<input type="hidden" class="form-control" name="id" th:value="${user.id}" readonly aria-readonly="true" />
										<select class="form-control" name="userRole" onchange="this.parentElement.submit();">
											<option disabled aria-disabled="true">Change role</option>
											<th:block th:each="role: ${roles}">
												<option th:value="${role}" th:selected="${role == user.userRole}" th:text="${role}"></option>
											</th:block>
										</select>
									</form>
								</td>
								<td th:text="${#dates.format(user.registeredAt, 'dd-MMM-yyyy')}"></td>
								<td>
									<div class="d-flex justify-content-end">
										<form th:action="@{toggle}" enctype="application/x-www-form-urlencoded" method="post">
											<input type="hidden" class="form-control" name="id" th:value="${user.id}" readonly aria-readonly="true" />
											<input type="hidden" class="form-control" name="isActive" th:value="${user.isActive}" readonly aria-readonly="true" />
											<button type="submit" class="btn btn-outline-primary btn-sm m-1">Toggle</button>
										</form>
										<form th:action="@{remove}" enctype="application/x-www-form-urlencoded" method="post">
											<input type="hidden" class="form-control" name="id" th:value="${user.id}" readonly aria-readonly="true" />
											<button type="submit" class="btn btn-outline-danger btn-sm m-1">Remove</button>
										</form>
									</div>
								</td>
							</tr>
							<tr th:if="${users.size < 1}">
								<td scope="row" colspan="6">
									<span class="badge rounded-pill text-bg-warning">No users</span>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
			<div class="row">
				<div class="offset-11 col-1">
					<!-- <button type="button" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#staticBackdrop">Add New User</button> -->
				</div>
			</div>
		</div>
		<div th:replace="~{fragments/toasts :: toasts}"></div>
		<script th:inline="javascript" type="text/javascript" th:if="${message}">
			/*<![CDATA[*/
			// alert(/*[[${message}]]*/);
			displayToast("Server", /*[[${message}]]*/);
			/*]]>*/
		</script>
	</body>
</html>
