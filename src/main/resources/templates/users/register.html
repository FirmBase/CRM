<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Register</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

		<link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
		<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}" type="text/javascript" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

		<script th:src="@{/jQuery/js/jquery-4.0.0.min.js}" type="text/javascript" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

		<link th:href="@{/datatable/css/datatables.min.css}" rel="stylesheet" />
		<script th:src="@{/datatable/js/datatables.min.js}" type="text/javascript"></script>

		<link th:href="@{/css/table.css}" rel="stylesheet" />
		<script th:src="@{/js/toasts-notification.js}" type="text/javascript"></script>
		<script th:inline="javascript" type="text/javascript">
			function emailAvailability(email) {
				if ((email.value.length > 0) && (email.value.indexOf("@") != -1)) {
					const xhttp = new XMLHttpRequest();
					xhttp.open("POST", "email-available", true);
					xhttp.onreadystatechange = function() {
						if (this.readyState >=4 )
							if (this.status == 200) {
								const registerButton = window.document.getElementById("register");
								if (this.responseText == "true") {
									displayToast("Server!", "Server reported this email is available.");
									registerButton.disabled = false;
								}
								else if (this.responseText == "false") {
									displayToast("Server!", "Server reported this email is unavailable.");
									registerButton.disabled = true;
								}
							}
							else
								displayToast("Warning!", "Failed to receive email confirmation.");
					}
					xhttp.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
					xhttp.send(new URLSearchParams({email: window.document.getElementById("email").value}).toString());
				}
			}

			function checkForSubmission() {
				const password = window.document.getElementById("password").value;
				const confirmPassword = window.document.getElementById("confirm_password").value;
				if (password == confirmPassword)
					return true;
				else {
					displayToast("Invalid fields", "Password do not match.");
					return false;
				}
			}
		</script>
	</head>
	<body>
		<div class="d-flex align-items-center min-vh-100">
			<div class="container">
				<div class="row">
					<h1 class="h1 text-center p-5 text-black m-0 p-0">Register</h1>
				</div>
				<form action="" enctype="application/x-www-form-urlencoded" method="post" onsubmit="return checkForSubmission(this);">
					<div class="row my-2">
						<div class="offset-3 col-2">
							<div class="form-floating">
								<input type="text" class="form-control" name="firstName" id="firstName" minlength="2" maxlength="16" placeholder="First name" aria-placeholder="First name" required aria-required="true" />
								<label for="firstName">First name</label>
							</div>
						</div>
						<div class="col-2">
							<div class="form-floating">
								<input type="text" class="form-control" name="middleName" id="middleName" maxlength="16" placeholder="Middle name" aria-placeholder="Middle name" aria-required="false" />
								<label for="middleName">Middle name</label>
							</div>
						</div>
						<div class="col-2">
							<div class="form-floating">
								<input type="text" class="form-control" name="lastName" id="lastName" minlength="2" maxlength="16" placeholder="Last name" aria-placeholder="Last name" required aria-required="true" />
								<label for="lastName">Last name</label>
							</div>
						</div>
					</div>
					<div class="row my-2">
						<div class="offset-4 col-4">
							<div class="form-floating">
								<input type="email" class="form-control" name="email" id="email" minlength="4" maxlength="32" placeholder="E-Mail" aria-placeholder="E-Mail" required aria-required="true" onblur="emailAvailability(this);" />
								<label for="email">E-Mail</label>
							</div>
						</div>
					</div>
					<div class="row my-2">
						<div class="offset-4 col-4">
							<div class="form-floating">
								<input type="password" class="form-control" name="password" id="password" minlength="4" maxlength="16" placeholder="Password" aria-placeholder="Password" required aria-required="true" />
								<label for="password">Password</label>
							</div>
						</div>
					</div>
					<div class="row my-2">
						<div class="offset-4 col-4">
							<div class="form-floating">
								<input type="password" class="form-control" name="confirm-password" id="confirm_password" minlength="4" maxlength="16" placeholder="Confirm password" aria-placeholder="Confirm password" required aria-required="true" />
								<label for="confirm_password">Confirm password</label>
							</div>
						</div>
					</div>
					<div class="row my-2">
						<div class="offset-4 col-4">
							<select class="form-select" aria-label="Select role" name="userRole" id="userRole" required aria-required="true">
								<option disabled aria-disabled="true" selected>Select role</option>
								<th:block th:each="role: ${roles}">
									<option th:value="${role}" th:text="${role}"></option>
								</th:block>
							</select>
						</div>
					</div>
					<div class="row my-2">
						<div class="offset-5 col-1">
							<button type="submit" id="register" class="btn btn-primary w-100">Register</button>
						</div>
						<div class="col-1">
							<a href="login">
								<button type="button" class="btn btn-outline-success w-100">Login</button>
							</a>
						</div>
					</div>
				</form>
			</div>
		</div>
		<div th:replace="~{fragments/toasts :: toasts}"></div>
		<script th:inline="javascript" type="text/javascript" th:if="${message}">
			/*<![CDATA[*/
			// alert(/*[[${message}]]*/);
			displayToast("Server", /*[[${message}]]*/);
			/*]]>*/
		</script>
	</body>
</html>
