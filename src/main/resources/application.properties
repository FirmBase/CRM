spring.application.name=crm
server.port=8080

# Include the exception message in the error attributes
server.error.include-message=on_param
# Include the full stack trace (options: always, never, on_param)
server.error.include-stacktrace=never
# Choose whether to show the binding errors layout
server.error.include-binding-errors=always

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/hlbs_erp
#spring.datasource.url=jdbc:mariadb://localhost:3306/hlbs_erp
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

#spring.security.user.name=admin
#spring.security.user.password=admin

#spring.jpa.database-platform=org.hibernate.dialect.MariaDBialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.show-sql=true

logging.level.com.hlbs.crm=TRACE
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.mail=TRACE
logging.level.org.eclipse.angus.mail=TRACE

spring.output.ansi.enabled=always

spring.devtools.restart.log-condition-evaluation-delta=false
management.endpoints.web.exposure.include=*
management.endpoint.loggers.enabled=true

#server.use-forwarded-headers=true
server.servlet.session.cookie.name=CRM
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

spring.mail.host=smtp.mail.yahoo.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
